name: build

on:
  workflow_dispatch:
    inputs:
      release_revision:
        description: Optional fork revision, for example r1 (application version stays unchanged)
        type: string
        required: false
        default: ''
      replace_existing_release:
        description: Update the existing version tag and assets after a successful build
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Verify OpenList compatibility
        run: mvn -B -pl ani-rss-application -am -Dtest=OpenListTaskStoreTest,OpenListUtilTest,OpenListCollectionOrganizerTest,OpenListCollectionServiceTest,OpenListUpstreamCompatibilityTest,OpenListCompletionVerifierTest,OpenListStagingCleanerTest,OpenListTaskDeletionTest,DownloadTaskDeletionTest,UpstreamBatchSubscriptionTest,OpenListRecoveryTest,OpenListOrdinaryPlanTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Build release artifacts
        env:
          REPLACE_EXISTING_RELEASE: ${{ inputs.replace_existing_release }}
          RELEASE_REVISION: ${{ inputs.release_revision }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_REVISION" ] && ! [[ "$RELEASE_REVISION" =~ ^r[1-9][0-9]*$ ]]; then
            echo "::error::Release revision must be empty or r followed by a positive integer, for example r1"
            exit 1
          fi
          bash ./package.sh
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f pom.xml)
          release_tag="v${version}-openlist"
          if [ -n "$RELEASE_REVISION" ]; then
            release_tag="${release_tag}-${RELEASE_REVISION}"
          fi
          existing_sha=$(git ls-remote --tags origin "refs/tags/${release_tag}" | awk 'NR == 1 {print $1}')
          if [ -n "$existing_sha" ] && [ "$existing_sha" != "$GITHUB_SHA" ] && [ "$REPLACE_EXISTING_RELEASE" != true ]; then
            echo "::error::Tag ${release_tag} already points to ${existing_sha}; refusing to replace a release with artifacts from ${GITHUB_SHA}"
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_ENV"
          echo "existing_release_sha=${existing_sha}" >> "$GITHUB_ENV"
      - name: Update existing release tag after successful build
        if: inputs.replace_existing_release && env.existing_release_sha != '' && env.existing_release_sha != github.sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" --jq '.object.sha')
          if [ "$current_sha" != "$existing_release_sha" ]; then
            echo "::error::Release tag changed during this build; refusing to replace it"
            exit 1
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${release_tag}" \
            -f sha="$GITHUB_SHA" -F force=true
      - name: Release
        id: release
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          name: ANI-RSS OpenList ${{ env.release_tag }}
          body_path: UPDATE.md
          tag_name: ${{ env.release_tag }}
          target_commitish: ${{ github.sha }}
          append_body: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true
          files: |
            ./ani-rss-application/target/ani-rss.jar
            ./ani-rss-application/target/ani-rss.exe
      # Keep publication working if the upstream action cannot update asset metadata.
      - name: Publish Release with GitHub CLI if the upstream action fails
        if: steps.release.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "ANI-RSS OpenList $release_tag" --notes-file UPDATE.md
          else
            gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" --draft \
              --target "$GITHUB_SHA" --title "ANI-RSS OpenList $release_tag" --notes-file UPDATE.md
          fi
          gh release upload "$release_tag" --repo "$GITHUB_REPOSITORY" --clobber \
            ./ani-rss-application/target/ani-rss.jar ./ani-rss-application/target/ani-rss.exe
          gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image (temurin)
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kkkkeybird/ani-rss-openlist:latest
            ghcr.io/kkkkeybird/ani-rss-openlist:${{ env.release_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Docker image (openj9)
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./docker/Dockerfile-openj9
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kkkkeybird/ani-rss-openlist:openj9
            ghcr.io/kkkkeybird/ani-rss-openlist:${{ env.release_tag }}-openj9
          cache-from: type=gha
          cache-to: type=gha,mode=max
