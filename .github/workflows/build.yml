name: build

on:
  workflow_dispatch:
    inputs:
      release_revision:
        description: Optional fork release revision (keeps the application version unchanged)
        required: false
        default: ''
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Verify OpenList compatibility
        run: mvn -B -pl ani-rss-application -am -Dtest=OpenListTaskStoreTest,OpenListUtilTest,OpenListCollectionOrganizerTest,OpenListCollectionServiceTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Build release artifacts
        env:
          RELEASE_REVISION: ${{ inputs.release_revision }}
        run: |
          set -euo pipefail
          bash ./package.sh
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f pom.xml)
          if [ -n "$RELEASE_REVISION" ] && [[ ! "$RELEASE_REVISION" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]; then
            echo "::error::Invalid release revision"
            exit 1
          fi
          release_tag="v${version}-openlist${RELEASE_REVISION:+-${RELEASE_REVISION}}"
          existing_sha=$(git ls-remote --tags origin "refs/tags/${release_tag}" | awk 'NR == 1 {print $1}')
          if [ -n "$existing_sha" ] && [ "$existing_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag ${release_tag} already points to ${existing_sha}; refusing to replace a release with artifacts from ${GITHUB_SHA}"
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_ENV"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image (temurin)
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kkkkeybird/ani-rss-openlist:latest
            ghcr.io/kkkkeybird/ani-rss-openlist:${{ env.release_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Docker image (openj9)
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./docker/Dockerfile-openj9
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kkkkeybird/ani-rss-openlist:openj9
            ghcr.io/kkkkeybird/ani-rss-openlist:${{ env.release_tag }}-openj9
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ANI-RSS OpenList ${{ env.release_tag }}
          tag_name: ${{ env.release_tag }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          body: |
            社区维护的 ANI-RSS OpenList fork，基于上游代码维护原生 OpenList 下载器。

            源码与使用限制请见仓库 README 和 docs/openlist-compat-evaluation.md。
            目前尚未在真实 OpenList Driver 上完成端到端验证，请先在测试环境使用。
          files: |
            ./ani-rss-application/target/ani-rss.jar
            ./ani-rss-application/target/ani-rss.exe
